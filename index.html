<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FANCODE EVENTS</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000;
  --card:#0b0b0c;
  --glass:rgba(255,255,255,0.05);
  --text:#f3f4f6;
  --muted:#9ca3af;
  --accent:#1db954;
}

body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system;
  background:linear-gradient(to bottom,#0a0a0a,#000);
  color:var(--text);
}

/* HEADER */
header{
  text-align:center;
  padding:18px;
  font-weight:600;
  font-size:20px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,0.05);
}

/* BUTTONS */
.type-filter{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:14px;
  flex-wrap:wrap;
}

.type-filter button{
  padding:10px 18px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.08);
  background:var(--glass);
  color:#d1d5db;
  cursor:pointer;
  transition:all .25s ease;
}

.type-filter button.active{
  background:var(--accent);
  color:#000;
  box-shadow:0 10px 25px rgba(29,185,84,0.35);
}

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  padding:10px 16px;
  flex-wrap:wrap;
}

/* SELECT */
.filters select{
  width:160px;
  padding:9px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.08);
  background:var(--glass);
  color:#e5e7eb;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:20px;
  padding:20px;
}

/* CARD */
.card{
  border-radius:16px;
  overflow:hidden;
  position:relative;
  background:var(--card);
  border:1px solid rgba(255,255,255,0.05);
  transition:transform .25s ease, box-shadow .25s ease;
}

.card:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 25px 60px rgba(0,0,0,0.85);
}

/* IMAGE */
.card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
  transition:opacity .3s ease, transform .4s ease;
}

.card:hover img{
  transform:scale(1.05);
}

/* VIDEO PREVIEW */
.preview-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity .3s ease;
  z-index:2;
}

.card.previewing img{
  opacity:0;
}

.card.previewing .preview-video{
  opacity:1;
}

/* BODY */
.card-body{
  padding:14px;
}

/* BADGE */
@keyframes livePulse{
  0%{box-shadow:0 0 0 0 rgba(29,185,84,0.6);}
  70%{box-shadow:0 0 0 12px rgba(29,185,84,0);}
  100%{box-shadow:0 0 0 0 rgba(29,185,84,0);}
}

.badge{
  font-size:11px;
  padding:4px 12px;
  border-radius:999px;
  font-weight:600;
}

.live{
  background:var(--accent);
  color:#000;
  animation:livePulse 1.5s infinite;
}

.upcoming{
  background:rgba(255,255,255,0.08);
  color:#d1d5db;
}

/* TEXT */
.title{
  font-size:15px;
  font-weight:600;
  margin-top:8px;
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

/* AMBIENT GLOW */
.card::before{
  content:"";
  position:absolute;
  inset:-20%;
  background:radial-gradient(circle,var(--ambient, rgba(255,255,255,0.15)),transparent 70%);
  opacity:0;
  transition:opacity .4s ease;
}

.card:hover::before{
  opacity:0.5;
}

/* FOCUS */
.card:focus{
  outline:2px solid var(--accent);
}

/* RESPONSIVE */
@media (max-width:600px){
  .filters select{width:120px}
}

@media (min-width:1200px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
}

</style>
</head>

<body>

<header onclick="location.reload()">
  <span>⚡ FANCODE EVENTS ⚡</span>
</header>

<div class="top-bar">
  <div class="filters">
    <select id="categoryFilter" onchange="render()">
      <option value="ALL">CATEGORIES</option>
    </select>
  </div>

  <div class="type-filter">
    <button class="active" onclick="setType('LIVE')">LIVE</button>
    <button onclick="setType('UPCOMING')">UPCOMING</button>
  </div>
</div>

<section class="grid" id="events"></section>

<script>
const API='https://fanco.vodep39240327.workers.dev/';
let allMatches=[],currentType='LIVE';

async function loadEvents(){
  const res=await fetch(API);
  const data=await res.json();

  allMatches=Array.isArray(data)?data:data.matches||[];

  buildFilters();
  render();
}

function buildFilters(){
  const catSel=categoryFilter;

  catSel.innerHTML='<option value="ALL">CATEGORIES</option>';

  [...new Set(allMatches.map(m=>m.event_category))]
    .forEach(c=>catSel.innerHTML+=`<option>${c}</option>`);
}

function setType(t){
  currentType=t;
  document.querySelectorAll('.type-filter button')
    .forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render(){
  events.innerHTML='';

  for(const m of allMatches){

    if(currentType==='LIVE' && m.status!=='LIVE') continue;
    if(currentType==='UPCOMING' && m.status==='LIVE') continue;

    const liveNow=m.status==='LIVE';

    events.innerHTML+=`
    <div class="card" tabindex="0"
      data-video="${m.src}"
      onclick="location.href='player.html?id=${m.match_id}'">

      <img src="${m.src}">
      <video class="preview-video" muted loop playsinline></video>

      <div class="card-body">
        <span class="badge ${liveNow?'live':'upcoming'}">
          ${liveNow?'LIVE':'UPCOMING'}
        </span>
        <div class="title">${m.match_name}</div>
        <div class="meta">${m.event_name}</div>
        <div class="meta">${m.event_category} • ${m.startTime}</div>
        <div class="meta">${m.team_1} vs ${m.team_2}</div>
      </div>
    </div>`;
  }

  attachPreview();
}

function attachPreview(){
  document.querySelectorAll(".card").forEach(card=>{
    const video = card.querySelector(".preview-video");
    const src = card.dataset.video;

    let loaded = false;

    card.addEventListener("mouseenter", ()=>{
      card.classList.add("previewing");

      if(!loaded){
        video.src = src;
        video.load();
        loaded = true;
      }

      video.play().catch(()=>{});
      card.style.setProperty("--ambient","rgba(29,185,84,0.25)");
    });

    card.addEventListener("mouseleave", ()=>{
      card.classList.remove("previewing");
      video.pause();
    });
  });
}

loadEvents();
setInterval(loadEvents,60000);
</script>

</body>
</html>
