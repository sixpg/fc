<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FANCODE EVENTS</title>

<style>
:root{
  --bg:#020617;
  --text:#e5e7eb;
}

body{
  margin:0;
  font-family:'Segoe UI',system-ui;
  background: radial-gradient(circle at top,#0b1633,#020617 80%);
  color:var(--text);
}

/* ANIMATION */
@keyframes flow{
  0%{background-position:0%}
  100%{background-position:200%}
}

/* HEADER */
header{
  text-align:center;
  padding:16px;
  font-weight:700;
  font-size:20px;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(10px);
}

header span{
  background:linear-gradient(90deg,#00f5ff,#ff007a,#00f5ff);
  background-size:200%;
  animation:flow 4s linear infinite;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* BUTTONS */
.type-filter{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:12px;
  flex-wrap:wrap;
}

.type-filter button{
  padding:10px 18px;
  border:none;
  border-radius:999px;
  color:white;
  cursor:pointer;
  font-weight:600;
  background:linear-gradient(90deg,#00f5ff,#ff007a,#00f5ff);
  background-size:200%;
  animation:flow 3s linear infinite;
}

.type-filter button.active{
  box-shadow:0 0 20px rgba(0,255,255,0.7);
}

/* TOP BAR */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 16px;
  flex-wrap:wrap;
}

/* CATEGORY */
.filters select{
  width:150px;
  padding:8px;
  border-radius:8px;
  border:none;
  color:white;
  background:linear-gradient(90deg,#00f5ff,#ff007a,#00f5ff);
  background-size:200%;
  animation:flow 4s linear infinite;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:16px;
  padding:16px;
}

/* CARD */
.card{
  border-radius:16px;
  overflow:hidden;
  position:relative;
  background:#0b162c;
}

/* BORDER ANIMATION */
.card::before{
  content:"";
  position:absolute;
  inset:0;
  padding:2px;
  background:linear-gradient(90deg,#00f5ff,#ff007a,#00f5ff);
  background-size:200%;
  animation:flow 5s linear infinite;
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  border-radius:16px;
}

.card img{
  width:100%;
  aspect-ratio:16/9;
  object-fit:cover;
}

.card-body{
  padding:12px;
}

/* 🔴 AESTHETIC LIVE PULSE */
@keyframes livePulse{
  0%{
    box-shadow:0 0 0 0 rgba(255,0,100,0.6);
  }
  70%{
    box-shadow:0 0 0 10px rgba(255,0,100,0);
  }
  100%{
    box-shadow:0 0 0 0 rgba(255,0,100,0);
  }
}

.badge{
  font-size:11px;
  padding:4px 12px;
  border-radius:999px;
  font-weight:600;
}

.live{
  background:#ff0066;
  color:white;
  animation:livePulse 1.5s infinite;
}

.upcoming{
  background:rgba(0,255,255,0.2);
  color:#00f5ff;
}

/* TEXT */
.title{font-weight:600}
.meta{font-size:12px;color:#aaa;margin-top:4px}

/* RESPONSIVE */
@media (max-width:600px){
  .filters select{width:120px}
  .type-filter button{padding:8px 14px;font-size:13px}
}

@media (min-width:1200px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
}

</style>
</head>

<body>

<header onclick="location.reload()">
  <span>⚡ FANCODE EVENTS ⚡</span>
</header>

<div class="top-bar">
  <div class="filters">
    <select id="categoryFilter" onchange="render()">
      <option value="ALL">CATEGORIES</option>
    </select>
  </div>

  <div class="type-filter">
    <button class="active" onclick="setType('LIVE')">LIVE</button>
    <button onclick="setType('UPCOMING')">UPCOMING</button>
  </div>
</div>

<section class="grid" id="events"></section>

<script>
const API='https://fanco.vodep39240327.workers.dev/';
let allMatches=[],currentType='LIVE';

async function loadEvents(){
  const res=await fetch(API);
  const data=await res.json();

  allMatches=Array.isArray(data)?data:data.matches||[];

  buildFilters();
  render();
}

function buildFilters(){
  const catSel=categoryFilter;

  catSel.innerHTML='<option value="ALL">CATEGORIES</option>';

  [...new Set(allMatches.map(m=>m.event_category))]
    .forEach(c=>catSel.innerHTML+=`<option>${c}</option>`);
}

function setType(t){
  currentType=t;
  document.querySelectorAll('.type-filter button')
    .forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  render();
}

function render(){
  events.innerHTML='';
  for(const m of allMatches){

    if(currentType==='LIVE' && m.status!=='LIVE') continue;
    if(currentType==='UPCOMING' && m.status==='LIVE') continue;

    const liveNow=m.status==='LIVE';

    events.innerHTML+=`
    <div class="card" tabindex="0"
      onclick="location.href='player.html?id=${m.match_id}'">
      <img src="${m.src}">
      <div class="card-body">
        <span class="badge ${liveNow?'live':'upcoming'}">
          ${liveNow?'LIVE':'UPCOMING'}
        </span>
        <div class="title">${m.match_name}</div>
        <div class="meta">${m.event_name}</div>
        <div class="meta">${m.event_category} • ${m.startTime}</div>
        <div class="meta">${m.team_1} vs ${m.team_2}</div>
      </div>
    </div>`;
  }
}

loadEvents();
setInterval(loadEvents,60000);
</script>

</body>
</html>
