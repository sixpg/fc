<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Match Streaming</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* CSS LEFT EXACTLY SAME — NOTHING CHANGED */
:root {
    --bg-color: #0f1115;
    --card-bg: #1c1f26;
    --text-main: #ffffff;
    --text-muted: #a1a1aa;
    --primary: #3b82f6;
    --primary-gradient: linear-gradient(135deg, #3b82f6, #2563eb);
    --accent: #f59e0b;
    --danger: #ef4444;
    --success: #10b981;
    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    --glass: rgba(28, 31, 38, 0.7);
}

/* ALL OTHER CSS KEPT IDENTICAL */

*{box-sizing:border-box;outline:none;-webkit-tap-highlight-color:transparent;}
body{margin:0;padding:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg-color);color:var(--text-main);min-height:125vh;display:flex;flex-direction:column;align-items:center;}
main{width:100%;max-width:1000px;padding:16px;padding-bottom:100px;display:flex;flex-direction:column;gap:20px;}
.player-section{position:relative;width:100%;border-radius:var(--radius-lg);overflow:hidden;background:#000;box-shadow:var(--shadow);aspect-ratio:16/9;}
.player-section iframe{position:absolute;top:-56;left:0;width:100%;height:100%;border:none;}
#live-counter{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);border-radius:50px;font-size:12px;color:#fff;z-index:10;border:1px solid rgba(255,255,255,0.1);}
#live-counter i{color:var(--danger);animation:pulse 2s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:0.5;}100%{opacity:1;}}
.match-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:16px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,0.05);}
.match-thumb{width:80px;height:80px;border-radius:var(--radius-md);object-fit:cover;background:#2a2d36;flex-shrink:0;}
.match-details{flex:1;overflow:hidden;}
.match-title{margin:0 0 6px 0;font-size:1.1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-main);}
.match-meta{display:flex;align-items:center;gap:10px;font-size:0.9rem;color:var(--text-muted);}
.badge-live{background:rgba(239,68,68,0.2);color:var(--danger);padding:2px 8px;border-radius:4px;font-size:0.75rem;font-weight:700;text-transform:uppercase;}
.actions-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:var(--radius-md);text-decoration:none;font-weight:600;font-size:0.95rem;transition:all 0.2s ease;cursor:pointer;}
.btn-primary{background:var(--primary-gradient);color:white;}
.btn-accent{background:linear-gradient(135deg,#f59e0b,#d97706);color:#000;}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--card-bg);color:white;padding:12px 24px;border-radius:50px;box-shadow:0 4px 15px rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:center;gap:10px;opacity:0;transition:all 0.3s ease;border:1px solid rgba(255,255,255,0.1);}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
#toast i{color:var(--success);}
</style>
</head>

<body>

<div id="toast"><i class="fas fa-check-circle"></i> <span>Link copied successfully!</span></div>

<main>

<section class="player-section">
<iframe id="videoIframe" src="" allowfullscreen scrolling="no" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="no-referrer"></iframe>

<div id="live-counter">
<i class="fas fa-circle"></i>
<div id="counter-div">
<script src="//widget.supercounters.com/ssl/online_t.js"></script>
<font color="f0f0f0"></font>
<script>sc_online_t(1703136,"Watching","00ffcc");</script>
</div>
</div>

</section>

<section class="match-card" id="matchInfo">
<div class="match-details">
<h3 class="match-title">Loading Match Data...</h3>
<div class="match-meta">Please wait</div>
</div>
</section>

<section class="actions-grid">

<a href="#" id="playNowButton1" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
<i class="fas fa-play"></i> Play Now
</a>

<button id="copyLinkButton" class="btn btn-accent">
<i class="fas fa-copy"></i> Copy Link
</button>

</section>
</main>

<script>

const matchId = new URLSearchParams(window.location.search).get('id');
const jsonUrl = 'https://raw.githubusercontent.com/drmlive/fancode-live-events/refs/heads/main/fancode.json';

const streamOrigin='https://allinonereborn.online/fcww';
const streamReferer='https://allinonereborn.online/fcww';

function showToast(message){
const toast=document.getElementById('toast');
toast.querySelector('span').innerText=message;
toast.classList.add('show');
setTimeout(()=>{toast.classList.remove('show');},3000);
}

function appendHeaders(url){
const separator=url.includes('?')?'&':'?';
return url+separator+'|Origin='+encodeURIComponent(streamOrigin)+'&Referer='+encodeURIComponent(streamReferer);
}

function initMatch(){
fetch(jsonUrl)
.then(res=>{
if(!res.ok) throw new Error('Network response was not ok');
return res.json();
})
.then(data=>{
let match=null;

if(data.matches && Array.isArray(data.matches)){
match=data.matches.find(m=>m.match_id===matchId);
}

if(!match){
renderError('Match not found or ID invalid.');
return;
}

renderMatchInfo(match);
setupPlayer(match);
setupButtons(match);
})
.catch(err=>{
console.error('Fetch error:',err);
renderError('Error loading match data.');
});
}

function renderError(msg){
const container=document.getElementById('matchInfo');
container.innerHTML=`
<div class="match-details" style="text-align:center;padding:20px;color:var(--danger);">
<i class="fas fa-exclamation-triangle fa-2x"></i>
<p>${msg}</p>
</div>`;
}

function renderMatchInfo(match){
const container=document.getElementById('matchInfo');
const imgSrc=match.src||`https://picsum.photos/seed/${match.match_id}/100/100`;

container.innerHTML=`
<img src="${imgSrc}" alt="${match.match_name}" class="match-thumb">
<div class="match-details">
<h2 class="match-title">${match.match_name}</h2>
<div class="match-meta">
<span class="badge-live">${match.status}</span>
</div>
</div>`;
}

function setupPlayer(match){
const videoLink=match.adfree_url||'';
if(videoLink){
const iframe=document.getElementById('videoIframe');
iframe.src="https://proxy.lrl45.workers.dev/?url="+encodeURIComponent(videoLink);
}
}

function setupButtons(match){
const videoLink=match.adfree_url||'';
const playNowBtn=document.getElementById('playNowButton1');

if(playNowBtn && videoLink){
const baseUrl="https://allinonereborn.store/fcww/player_india.html";
const fullUrl=`${baseUrl}?stream=${encodeURIComponent(videoLink)}`;
playNowBtn.href=fullUrl;
playNowBtn.target="_blank";
playNowBtn.rel="noopener noreferrer";
}

const modifiedLink=appendHeaders(videoLink);

document.getElementById('copyLinkButton').addEventListener('click',(e)=>{
e.preventDefault();
navigator.clipboard.writeText(modifiedLink)
.then(()=>showToast('Link copied with Headers!'))
.catch(()=>showToast('Failed to copy link.'));
});
}

document.addEventListener('DOMContentLoaded',()=>{
initMatch();
});

</script>

</body>
</html>
