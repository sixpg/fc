<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Match Streaming</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

<style>
:root {
    --bg-color:#0f1115;
    --card-bg:#1c1f26;
    --text-main:#ffffff;
    --text-muted:#a1a1aa;
    --primary:#3b82f6;
    --primary-gradient:linear-gradient(135deg,#3b82f6,#2563eb);
    --accent:#f59e0b;
    --danger:#ef4444;
    --success:#10b981;
    --radius-lg:16px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow:0 4px 20px rgba(0,0,0,.5);
}

*{box-sizing:border-box;outline:none;-webkit-tap-highlight-color:transparent;}

body{
margin:0;
padding:0;
font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
background-color:var(--bg-color);
color:var(--text-main);
min-height:125vh;
display:flex;
flex-direction:column;
align-items:center;
}

main{
width:100%;
max-width:1000px;
padding:16px;
padding-bottom:100px;
display:flex;
flex-direction:column;
gap:20px;
}

.player-section{
position:relative;
width:100%;
border-radius:var(--radius-lg);
overflow:hidden;
background:#000;
box-shadow:var(--shadow);
aspect-ratio:16/9;
}

.player-wrap{
width:100%;
height:100%;
}

.player-wrap video{
width:100%;
height:100%;
}

#live-counter{
position:absolute;
top:12px;
right:12px;
display:flex;
align-items:center;
gap:8px;
padding:6px 14px;
background:rgba(0,0,0,.6);
backdrop-filter:blur(8px);
border-radius:50px;
font-size:12px;
color:#fff;
z-index:10;
border:1px solid rgba(255,255,255,.1);
}

#live-counter i{
color:var(--danger);
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{opacity:1;}
50%{opacity:.5;}
100%{opacity:1;}
}

.match-card{
background:var(--card-bg);
border-radius:var(--radius-lg);
padding:16px;
display:flex;
align-items:center;
gap:16px;
box-shadow:var(--shadow);
border:1px solid rgba(255,255,255,.05);
}

.match-thumb{
width:80px;
height:80px;
border-radius:var(--radius-md);
object-fit:cover;
background:#2a2d36;
flex-shrink:0;
}

.match-details{flex:1;overflow:hidden;}

.match-title{
margin:0 0 6px 0;
font-size:1.1rem;
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.match-meta{
display:flex;
align-items:center;
gap:10px;
font-size:.9rem;
color:var(--text-muted);
}

.badge-live{
background:rgba(239,68,68,.2);
color:var(--danger);
padding:2px 8px;
border-radius:4px;
font-size:.75rem;
font-weight:700;
text-transform:uppercase;
}

.actions-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.btn{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
padding:12px 20px;
border-radius:var(--radius-md);
text-decoration:none;
font-weight:600;
font-size:.95rem;
cursor:pointer;
border:none;
}

.btn-primary{
background:var(--primary-gradient);
color:#fff;
}

.btn-accent{
background:linear-gradient(135deg,#f59e0b,#d97706);
color:#000;
}

#toast{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%) translateY(-100px);
background:var(--card-bg);
color:#fff;
padding:12px 24px;
border-radius:50px;
z-index:2000;
opacity:0;
transition:.3s;
}

#toast.show{
transform:translateX(-50%) translateY(0);
opacity:1;
}
</style>
</head>

<body>

<div id="toast"><span>Link copied successfully!</span></div>

<main>

<section class="player-section">

<div class="player-wrap">
<video id="video" playsinline controls></video>
</div>

<div id="live-counter">
<i class="fas fa-circle"></i>
LIVE
</div>

</section>

<section class="match-card" id="matchInfo">
<div class="match-details">
<h3 class="match-title">Loading Match Data...</h3>
<div class="match-meta">Please wait</div>
</div>
</section>

<section class="actions-grid">

<a href="#" id="playNowButton1" class="btn btn-primary" target="_blank">
<i class="fas fa-play"></i> Play Now
</a>

<button id="copyLinkButton" class="btn btn-accent">
<i class="fas fa-copy"></i> Copy Link
</button>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<script>

const matchId = new URLSearchParams(window.location.search).get('id');
const jsonUrl = 'https://raw.githubusercontent.com/drmlive/fancode-live-events/refs/heads/main/fancode.json';

const player = new Plyr('#video',{
controls:[
'play-large',
'rewind',
'play',
'fast-forward',
'progress',
'current-time',
'mute',
'volume',
'settings',
'fullscreen'
]
});

function showToast(message){
const toast=document.getElementById('toast');
toast.querySelector('span').innerText=message;
toast.classList.add('show');
setTimeout(()=>toast.classList.remove('show'),3000);
}

function initMatch(){
fetch(jsonUrl)
.then(r=>r.json())
.then(data=>{

let match=null;

if(Array.isArray(data)){
match=data.find(m=>String(m.match_id)===String(matchId));
}else if(data.matches){
match=data.matches.find(m=>String(m.match_id)===String(matchId));
}

if(!match){
renderError('Match not found.');
return;
}

renderMatch(match);
setupPlayer(match.adfree_url);
setupButtons(match);

})
.catch(()=>{
renderError('Error loading data.');
});
}

function renderError(msg){
document.getElementById('matchInfo').innerHTML=`
<div class="match-details">
<h3 class="match-title">${msg}</h3>
</div>`;
}

function renderMatch(match){
document.getElementById('matchInfo').innerHTML=`
<img src="${match.src}" class="match-thumb">
<div class="match-details">
<h2 class="match-title">${match.match_name}</h2>
<div class="match-meta">
<span class="badge-live">${match.status}</span>
</div>
</div>`;
}

function setupPlayer(url){

const video=document.getElementById('video');

if(Hls.isSupported()){

const hls=new Hls({
enableWorker:true,
lowLatencyMode:true
});

hls.loadSource(url);
hls.attachMedia(video);

hls.on(Hls.Events.MANIFEST_PARSED,function(){
video.play().catch(()=>{});
});

}else if(video.canPlayType('application/vnd.apple.mpegurl')){

video.src=url;
video.play().catch(()=>{});

}
}

function setupButtons(match){

const url=match.adfree_url;

document.getElementById('playNowButton1').href=url;

document.getElementById('copyLinkButton').onclick=()=>{
navigator.clipboard.writeText(url)
.then(()=>showToast('Link copied successfully!'));
};

}

document.addEventListener('DOMContentLoaded',initMatch);

</script>

</body>
</html>
